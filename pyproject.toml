[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ma-engine"
version = "0.1.0"
description = "An open-source deal-sourcing engine. It scores companies on signals that the owner may be heading towards a sale, with the reasons written out, and drafts a dossier with a buyer shortlist. Ships with a China succession example on synthetic data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MA Engine contributors" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ashare = ["requests>=2.31", "pypdf>=4.0"]
llm = ["anthropic>=0.40"]
tune = ["optuna>=3.6"]
dev = ["pytest>=8.0", "optuna>=3.6"]

[project.scripts]
ma-engine = "ma_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
