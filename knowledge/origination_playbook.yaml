# How professional deal sourcing actually works.
#
# Sources: Rosenbaum & Pearl (Investment Banking, ch. 6-7), Grata
# origination guides, Wall Street Prep sell-side process, IESE
# International Search Fund Study 2020, Stanford GSB search fund
# research. Every number carries a confidence tag:
#   well_sourced - read directly from the named source
#   medium      - from a real named report whose exact figure is gated
#   heuristic   - practitioner rule of thumb, no formal source

buyer_list_construction:
  tiering:
    a_list:
      size: 15-30 names
      rule: highest strategic fit AND capacity AND likelihood to pay;
        contacted first with senior attention
    b_list:
      rule: credible but weaker fit or capacity; contacted in the same
        round to create tension
    c_list:
      rule: opportunistic long shots; only in broad processes
    confidence: heuristic
  process_sizes:
    broad_auction: many buyers, mid-market below ~100M USD equity value
    limited_auction: 10-50 buyers, mixed strategic and financial
    targeted_auction: 2-5 hand-picked buyers
    exclusive: 1 buyer
    confidence: well_sourced  # Wall Street Prep
  screening_dimensions:
    - key: size_compatibility
      rules:
        - deal value at or below 10-20% of a strategic buyer's enterprise
          value is comfortably digestible
        - add-on revenue typically below 30-50% of the platform's revenue
      confidence: heuristic
    - key: acquisition_history
      rules:
        - one closed deal in the last 24-36 months marks a buyer as acquisitive
        - three or more deals in three years marks a serial acquirer;
          they go to the top of the list
      confidence: heuristic
    - key: balance_sheet_capacity
      rules:
        - strategics stretch to roughly 3x net debt to EBITDA pro forma
        - sponsors stretch to 4-5.5x depending on the rate environment
        - for funds, check vintage; funds in years 1-3 of their
          investment period are active buyers
      confidence: heuristic
    - key: stated_strategy
      rules:
        - annual reports, earnings calls, and fund thesis pages that say
          "pursuing M&A in X" are the cheapest reliable buyer signal
      confidence: well_sourced  # Grata

seller_intent_signals:
  # What makes an owner a real seller, before they say so.
  signals:
    - owner at or past retirement age with no heir in the business
    - a CFO hired or reporting formalized for the first time
    - an external advisor engaged
    - succession planning activity visible
  confidence: well_sourced  # Grata seller-intent framework

funnel_benchmarks:
  documented_case:
    description: Spearhead Corporate Development, 2020-2022, via Grata
    numbers: 6,427 touchpoints -> 1,032 targets -> 574 responses ->
      123 qualified ideas -> 4 LOIs -> 3 closed deals
    lesson: about 0.3% of touched targets close; multi-touch targeted
      outreach got a ~55% response rate
    confidence: well_sourced
  outreach_channels:
    rules:
      - generic mass email response is under 1%; segmentation and
        personalization raise opens to 40-50% for the best firms
      - personalized physical letters to older owners often beat email;
        phone follow-up multiplies letter response
      - a real owner conversation typically takes 4-8 touches over months
    confidence: heuristic
  pe_ratio:
    rule: mid-market PE reviews on the order of 80-100 opportunities
      per closed platform deal
    confidence: medium  # Teten & Farmer lineage, echoed by Bain
  search_funds:
    facts:
      - median search length 19 months (IESE 2020)
      - roughly three quarters of searches end in an acquisition
      - proprietary direct outreach beats brokers as the top deal source
    confidence: well_sourced
  mandate_nurture:
    rule: first owner contact to signed sell-side mandate typically
      takes 6-24 months of relationship building; no published
      benchmark exists
    confidence: heuristic
  process_length:
    rule: a run sell-side process takes 18-26 weeks from preparation
      to signing
    confidence: well_sourced  # Wall Street Prep

documents:
  teaser:
    length: 1-3 pages, sent before any NDA, on a no-names basis with a
      code name
    sections:
      - opportunity statement ("a leading provider of X")
      - investment highlights, 5-8 bullets
      - financial summary with rounded figures, 2-3 years
      - industry overview
      - geography at region level only
      - transaction overview, deliberately vague
      - advisor contact for NDA
    anonymization_test: a competitor reading it must not be able to
      identify the company
    confidence: well_sourced  # CFI, Rosenbaum & Pearl
  target_profile:
    # The buy-side one-pager this project's dossier mirrors.
    sections:
      - identity (name, location, founded, ownership type, owner)
      - size (revenue and margin estimates with sources and confidence)
      - business (model, products, end markets, certifications)
      - fit (why this target, for which buyers)
      - signals (succession, seller intent, acquisition interest)
      - action (relationship path, tier, next step)
    rule: every figure is marked as an estimate with its source
    confidence: heuristic  # no canonical public standard
