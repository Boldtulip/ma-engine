# Signal weights for the succession score.
#
# These weights are ILLUSTRATIVE DEFAULTS. They encode a reasonable
# prior: the owner's age matters most, then whether a successor is
# visible, then how long the owner has held the company, then
# financial pressure. They are NOT calibrated. Calibration requires
# outcome data on which companies actually sold, and that data is
# exactly what a practitioner accumulates and this repository does
# not ship.

weights:
  founder_age: 0.35
  heir_absence: 0.30
  owner_tenure: 0.20
  sell_pressure: 0.15

# A signal's contribution is score * weight * confidence, so an
# uncertain reading (for example an age estimated only from a name)
# moves the total less than a disclosed fact.
